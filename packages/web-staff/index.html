<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediTracker — 직원용</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a2e; }
      body { font-family: ui-sans-serif, system-ui, "Malgun Gothic", sans-serif; }
      /* 맵은 화면 전체를 그대로 쓴다 — 패널은 그 위에 겹친다 (접고 펴도 맵이 안 움직임) */
      #app { width: 100%; height: 100%; }

      /* ── 왼쪽 비콘 목록 (맵 위에 오버레이) ──────────────────────────── */
      #sidebar {
        position: fixed; left: 12px; top: 12px; z-index: 90;
        width: 282px; height: calc(100% - 24px);
        display: flex; flex-direction: column;
        background: #141a26f2; border: 1px solid #2a3448; border-radius: 10px;
        box-shadow: 0 8px 24px #0008;
        color: #dbe4f0; overflow: hidden;
      }
      /* 접으면 헤더만 남는다 (맵은 그대로) */
      #sidebar.collapsed { height: auto; }
      #panel-toggle {
        display: flex; align-items: center; gap: 7px; width: 100%;
        padding: 10px 12px; box-sizing: border-box; cursor: pointer;
        background: none; border: none; border-bottom: 1px solid #253046;
        color: #cfdcec; font: 700 13px inherit; text-align: left;
      }
      #panel-toggle:hover { background: #1b2434; }
      #panel-toggle .num {
        margin-left: auto; padding: 1px 7px; border-radius: 999px;
        background: #1f2b40; color: #b8c8dd; font-size: 12px; font-weight: 600;
      }
      #panel-toggle .fold { color: #6f8099; font-size: 11px; }
      #sidebar.collapsed #panel-body { display: none; }
      #sidebar.collapsed #panel-toggle { border-bottom: none; }
      #sidebar.collapsed .fold::before { content: "▸"; }
      #sidebar:not(.collapsed) .fold::before { content: "▾"; }

      /* 비콘 현황이 위(넓게), 그룹 버튼은 맨 아래 */
      #panel-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

      /* 그룹 버튼 — 패널 맨 아래, 자리 고정 (그룹을 열어도 밀리지 않는다) */
      #group-tabs {
        flex: none; margin-top: auto; padding: 6px;
        border-top: 1px solid #2f3d55; background: #101725cc;
        display: flex; flex-direction: column; gap: 3px;
      }
      .group-btn {
        display: flex; align-items: center; gap: 7px; width: 100%;
        padding: 7px 9px; box-sizing: border-box; cursor: pointer;
        background: #19212f; border: 1px solid #253046; border-radius: 7px;
        color: #b9c8dc; font: 600 12.5px inherit; text-align: left;
      }
      .group-btn:hover { background: #1f2a3b; }
      .group-btn.open { background: #22405f; border-color: #3f6f9e; color: #fff; }
      .group-btn .chev { font-size: 10px; color: #6f8099; transition: transform .12s; }
      .group-btn.open .chev { transform: rotate(90deg); color: #cfe3f7; }
      /* 그룹 색 견본 — 맵 위 점·목록 아이콘과 같은 색 */
      .group-btn .swatch {
        flex: none; width: 9px; height: 9px; border-radius: 50%;
        box-shadow: 0 0 0 1px #0006;
      }
      .group-btn .lbl { flex: 1; }
      .group-btn .n {
        padding: 0 6px; border-radius: 999px; background: #101725;
        color: #6d7d94; font-size: 11px;
      }
      .group-btn.has .n { color: #dbe4f0; }
      .group-btn.open .n { background: #14263a; color: #fff; }
      /* 그룹을 접어 둬도 경고는 보여야 한다 */
      .group-btn .bang { display: none; }
      .group-btn.alert .bang { display: inline-flex; }

      /* 열린 그룹의 비콘 현황 — 헤더 바로 아래, 남는 높이를 다 쓴다 */
      #group-list {
        flex: 1; min-height: 0;
        display: flex; flex-direction: column; overflow: hidden;
      }
      #group-title {
        flex: none; padding: 8px 12px 5px; font-size: 11px; font-weight: 700;
        letter-spacing: .03em; color: #8fa3bf;
      }
      #tag-list { margin: 0; padding: 0 6px 8px; list-style: none; overflow-y: auto; }
      #tag-empty { padding: 10px 12px 14px; color: #5d6b80; font-size: 11.5px; }

      .tag-row { display: flex; gap: 9px; align-items: flex-start; padding: 7px 6px; border-radius: 8px; }
      .tag-row + .tag-row { border-top: 1px solid #1e2839; }
      .tag-row:hover { background: #18202f; }
      .tag-row.absent { opacity: .55; }

      /* 맨 왼쪽 비콘 그림 — 맵 아바타와 같은 색 */
      .beacon { flex: none; width: 28px; height: 28px; cursor: pointer; }
      .beacon svg {
        width: 28px; height: 28px; display: block;
        fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round;
      }
      .beacon svg circle { fill: currentColor; stroke: none; }
      .beacon:hover svg { filter: brightness(1.35); }

      .info { flex: 1; min-width: 0; }
      .info .line { display: flex; gap: 4px; align-items: center; }
      .info input, .info select {
        box-sizing: border-box; background: transparent;
        border: 1px solid transparent; border-radius: 5px; padding: 2px 4px;
        color: inherit; font: inherit;
      }
      .info input { width: 100%; }
      .info input:hover, .info select:hover { border-color: #2c3a52; }
      .info input:focus, .info select:focus { outline: none; border-color: #58a6ff; background: #101725; }
      .info .name { font-size: 13px; font-weight: 700; }
      .info .name::placeholder { color: #6b7a90; font-weight: 400; }
      .info .memo { font-size: 11px; color: #93a3b8; }
      .info .memo::placeholder { color: #4e5b6e; }
      .info .grp { flex: none; font-size: 10.5px; color: #8fa3bf; cursor: pointer; }
      .info .grp option { background: #141a26; color: #dbe4f0; }

      /* 현황 줄이 가장 눈에 띄어야 한다 — 칩 배경 + 굵은 방 이름 */
      .status {
        display: flex; align-items: center; gap: 6px; margin: 2px 0;
        padding: 3px 7px; border-radius: 6px; background: #1b2739;
        font-size: 12px; color: #d7e3f2;
      }
      .status b { font-weight: 700; }
      .tag-row.absent .status { background: #1a1f2a; color: #93a1b4; }
      .status .dim { color: #77869b; }
      .status .sig { flex: none; width: 7px; height: 7px; border-radius: 50%; }
      .status .sig.ok   { background: #3fb950; box-shadow: 0 0 5px #3fb95088; }
      .status .sig.warn { background: #d29922; }
      .status .sig.off  { background: #4b5666; }
      .tag-row.alerted .status { background: #3d1621; color: #ffdde2; }

      /* ── 장기체류 경고 표시 ──────────────────────────────────────────
         빨간 ! 가 깜빡인다. 맵 위 비콘 배지 · 이 목록 · 경고창이 같은 표시를
         쓰고, 애니메이션 주기도 같아서 화면 전체가 한 박자로 깜빡인다. */
      @keyframes bang-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .1; } }
      .bang {
        flex: none; display: inline-flex; align-items: center; justify-content: center;
        width: 15px; height: 15px; border-radius: 50%;
        background: #ff2f45; color: #fff;
        font: 900 11px/1 ui-sans-serif, system-ui, sans-serif; font-style: normal;
        box-shadow: 0 0 0 1px #ffffff55;
        animation: bang-blink .84s infinite;
      }
      .bang.lg { width: 19px; height: 19px; font-size: 14px; }

      /* ── 환자 장기체류 경고창 (화면 위 가운데) ───────────────────────── */
      @keyframes alert-glow {
        0%, 49%   { box-shadow: 0 10px 28px #000a, 0 0 0 3px #ff2f4566; }
        50%, 100% { box-shadow: 0 10px 28px #000a, 0 0 0 3px #ff2f4500; }
      }
      #alerts {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 200;
        width: 340px; max-height: calc(100% - 24px);
        display: flex; flex-direction: column; overflow: hidden;
        background: #2a1017f5; border: 1px solid #ff2f45; border-radius: 10px;
        color: #ffe2e6; animation: alert-glow .84s infinite;
      }
      #alerts[hidden] { display: none; }
      #alerts-head {
        flex: none; display: flex; align-items: center; gap: 8px;
        padding: 9px 11px; border-bottom: 1px solid #6d2230; background: #3b141e;
        font: 700 13px inherit; color: #ffd7dd;
      }
      #alerts-head .hint { font-weight: 400; font-size: 11px; color: #d1919c; }
      #alerts-n {
        margin-left: auto; padding: 1px 8px; border-radius: 999px;
        background: #ff2f45; color: #fff; font-size: 12px;
      }
      #alerts-list { margin: 0; padding: 4px 6px 7px; list-style: none; overflow-y: auto; }
      .alert-row { padding: 7px 5px; border-radius: 7px; }
      .alert-row + .alert-row { border-top: 1px solid #5a1f2a; }
      .alert-row .top { display: flex; align-items: center; gap: 8px; }
      .alert-row .who {
        flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        padding: 0; border: none; background: none; cursor: pointer;
        color: #fff; font: 700 13px inherit; text-align: left;
      }
      .alert-row .who:hover { text-decoration: underline; }
      .alert-row .ack {
        flex: none; padding: 3px 9px; border-radius: 6px; cursor: pointer;
        border: 1px solid #96404e; background: #4b1a24; color: #ffc9d1;
        font: 600 11.5px inherit;
      }
      .alert-row .ack:hover { background: #63222f; color: #fff; }
      .alert-row .sub { margin: 3px 0 0 23px; font-size: 11.5px; color: #efa6b1; }
      .alert-row .sub b { color: #fff; font-weight: 700; }

      /* ── 오른쪽 세로 버튼 (오른쪽 끝에 붙임) ────────────────────────── */
      #tools {
        position: fixed; top: 14px; right: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: stretch; gap: 8px;
      }
      #tools > * {
        padding: 8px 14px; border-radius: 6px 0 0 6px; border-right: none;
        font: 600 13px ui-monospace, monospace; cursor: pointer;
        text-align: left; text-decoration: none; white-space: nowrap;
      }
      #admin-btn { border: 1px solid #58a6ff; background: #1c2b45; color: #58a6ff; }
      #admin-btn:hover { background: #234; }
      #patient-btn { border: 1px solid #b98ce0; background: #271c38; color: #d6b8f5; }
      #patient-btn:hover { background: #352348; }
      #name-btn { border: 1px solid #4fae7f; background: #1c2b23; color: #8fe3b4; }
      #name-btn:hover { background: #23372c; }
      #name-btn.on { background: #2c6b4a; color: #fff; }
      #blocked-btn { border: 1px solid #d05050; background: #2b1c1c; color: #ff9d9d; }
      #blocked-btn:hover { background: #3a2323; }
      #blocked-btn.on { background: #7a2b2b; color: #fff; }

      /* ── 인포 데스크: 환자 등록/반납 ─────────────────────────────── */
      #badmin-btn { border: 1px solid #4a9b7f; background: #16302a; color: #7fe0bd; }
      #badmin-btn:hover { background: #1e4038; }
      #badmin-btn.on { background: #2f7a63; color: #fff; }
      #badmin {
        position: fixed; inset: 0; z-index: 220; background: #000a;
        display: flex; align-items: center; justify-content: center;
      }
      #badmin[hidden] { display: none; }
      #badmin-box {
        width: 460px; max-height: 82vh; display: flex; flex-direction: column;
        background: #141a24; border: 1px solid #2f3a4c; border-radius: 10px;
        box-shadow: 0 12px 40px #000b; overflow: hidden;
      }
      #badmin-head {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        border-bottom: 1px solid #2f3a4c; background: #1a212d; color: #e6edf6;
      }
      #badmin-filter { display: flex; gap: 4px; margin-left: auto; }
      #badmin-filter button {
        padding: 3px 9px; border-radius: 999px; cursor: pointer;
        border: 1px solid #3a4658; background: none; color: #9fb0c6; font: 600 11px inherit;
      }
      #badmin-filter button.on { background: #2f7a63; border-color: #2f7a63; color: #fff; }
      #badmin-close {
        padding: 2px 7px; border-radius: 6px; cursor: pointer;
        border: 1px solid #3a4658; background: none; color: #9fb0c6;
      }
      #badmin-list { overflow-y: auto; padding: 6px 8px 10px; }
      .badmin-empty { padding: 24px; text-align: center; color: #6d7d94; font-size: 12px; }
      .badmin-gh {
        display: flex; align-items: center; gap: 6px; margin: 10px 2px 4px;
        color: #8fa0b8; font-size: 11px;
      }
      .badmin-gh i { width: 8px; height: 8px; border-radius: 50%; }
      .badmin-gh b { color: #cfdcec; }
      /* 줄마다 칸을 고정한다 — 이름 길이가 제각각이라 버튼이 들쭉날쭉하면 누르기 어렵다 */
      .badmin-row {
        display: flex; align-items: center; gap: 8px;
        padding: 5px 6px; border-radius: 6px;
      }
      .badmin-row:hover { background: #1b2431; }
      .badmin-id {
        flex: none; width: 68px; color: #7f8ea6;
        font: 600 11px ui-monospace, monospace;
      }
      .badmin-who { flex: 1; min-width: 0; color: #fff; font-size: 13px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badmin-idle { flex: 1; min-width: 0; color: #7f8ea6; font-size: 11.5px; }
      .badmin-dead { color: #ff9d9d; }
      .badmin-btn {
        flex: none; padding: 3px 10px; border-radius: 6px; cursor: pointer;
        font: 600 11.5px inherit;
      }
      .badmin-btn.asg { border: 1px solid #2f7a63; background: #16302a; color: #7fe0bd; }
      .badmin-btn.asg:hover { background: #1e4038; color: #fff; }
      .badmin-btn.rel { border: 1px solid #6b5a2a; background: #2b2410; color: #e3c46a; }
      .badmin-btn.rel:hover { background: #3a3115; color: #fff; }

      /* 게이트웨이 범위 보기 */
      #gw-btn { border: 1px solid #d3a13c; background: #2e2513; color: #ffd489; }
      #gw-btn:hover { background: #3d3119; }
      #gw-btn.on { background: #7a5c14; color: #fff; }
      /* 범례·주의문 — 버튼 바로 아래, 오른쪽 끝에 붙는다 */
      #tools > #gw-hint {
        width: 224px; padding: 8px 11px; box-sizing: border-box;
        border: 1px solid #6a5526; border-right: none; border-radius: 6px 0 0 6px;
        background: #241d0ff2; color: #e6d3a8;
        font: 400 11px/1.5 ui-sans-serif, system-ui, "Malgun Gothic", sans-serif;
        white-space: normal; cursor: default;
      }
      #gw-hint[hidden] { display: none; }
      #gw-hint b { color: #ffd489; }
      /* 실측이 아니라는 표시는 항상 붙어 있어야 한다 */
      #gw-hint i { display: inline-block; margin-top: 3px; color: #b09a68; font-style: normal; }

      /* 시연 모드 배지 — 서버 없이 도는 중임을 숨기지 않는다.
         움직임이 진짜와 구분이 안 되므로, 표시가 없으면 실제 추적 정확도로 오해한다. */
      #demo-badge {
        position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 150;
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        padding: 7px 16px; border-radius: 8px;
        background: #3a2c0ef0; border: 1px solid #a8801f;
        color: #ffd97a; text-align: center; pointer-events: none;
      }
      #demo-badge b { font-size: 12.5px; letter-spacing: .02em; }
      #demo-badge span { font-size: 11px; color: #d3b878; }

      /* 도면 확대/축소 — 세 칸이 한 덩어리 (다른 버튼과 같은 줄에 맞춘다) */
      #tools > #zoom-box {
        display: flex; align-items: stretch; padding: 0; overflow: hidden;
        border: 1px solid #6b7b93; border-right: none; border-radius: 6px 0 0 6px;
        background: #19212f; color: #cfdcec;
      }
      #zoom-box .ic { padding: 7px 6px 7px 9px; font-size: 12px; opacity: .75; }
      #zoom-box button {
        padding: 7px 9px; border: none; background: none; cursor: pointer;
        color: #cfdcec; font: 700 14px/1 ui-monospace, monospace;
      }
      #zoom-box button:hover:not(:disabled) { background: #2a3547; color: #fff; }
      #zoom-box button:disabled { color: #4a5568; cursor: default; }
      #zoom-box #zoom-level {
        min-width: 52px; text-align: center; font-size: 12px; color: #9fb2ca;
        border-left: 1px solid #2c3a52; border-right: 1px solid #2c3a52;
      }
      #zoom-box #zoom-level:hover { color: #fff; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- 비콘 목록: 그룹 버튼은 자리 고정, 열린 그룹의 목록만 아래에 펼쳐진다 -->
    <aside id="sidebar">
      <button id="panel-toggle" type="button">
        📡 비콘 목록<span class="num" id="tag-count">0</span><span class="fold"></span>
      </button>
      <div id="panel-body">
        <!-- 비콘 현황이 위, 그룹 버튼은 맨 아래 -->
        <div id="group-list">
          <div id="group-title" style="display: none"></div>
          <ul id="tag-list"></ul>
          <div id="tag-empty">그룹을 눌러 비콘을 펼쳐보세요.</div>
        </div>
        <div id="group-tabs"></div>
      </div>
    </aside>

    <!-- 인포 데스크 — 비콘 재고 전체(배정+창고). 왼쪽 목록은 추적 중인 것만 보여주므로
         창고 비콘에 환자를 등록하려면 이 화면이 따로 있어야 한다. 줄은 JS 가 만든다. -->
    <div id="badmin" hidden>
      <div id="badmin-box">
        <div id="badmin-head">
          <b>환자 등록 / 반납</b>
          <div id="badmin-filter">
            <button data-f="all" data-label="전체" class="on">전체</button>
            <button data-f="assigned" data-label="배정중">배정중</button>
            <button data-f="idle" data-label="창고">창고</button>
          </div>
          <button id="badmin-close" type="button" title="닫기">✕</button>
        </div>
        <div id="badmin-list"></div>
      </div>
    </div>

    <!-- 환자·미지정 비콘이 10분 넘게 같은 자리에 있으면 여기에 뜬다 (줄은 JS 가 만든다) -->
    <div id="alerts" hidden>
      <div id="alerts-head">
        <i class="bang lg">!</i>
        장기 체류 <span class="hint">10분 이상 같은 자리</span>
        <span id="alerts-n">0</span>
      </div>
      <ul id="alerts-list"></ul>
    </div>

    <div id="tools">
      <!-- 도면 확대/축소 — 배율을 누르면 원래 크기로. 휠·드래그로도 된다 -->
      <div id="zoom-box">
        <span class="ic">🔍</span>
        <button id="zoom-out" type="button" title="도면 축소">−</button>
        <button id="zoom-level" type="button" title="원래 크기로">100%</button>
        <button id="zoom-in" type="button" title="도면 확대">+</button>
      </div>
      <!-- 방 이름 표시 토글 (도면 PDF 라벨 그대로) -->
      <button id="name-btn" type="button">🏷 이름</button>
      <!-- 통제구역(벽·계단·엘리베이터) 표시 토글 -->
      <button id="blocked-btn" type="button">🚧 통제구역 보기</button>
      <!-- 인포 데스크: 비콘 재고 전체에서 환자 등록/반납 -->
      <button id="badmin-btn" type="button">👥 환자 등록/반납</button>
      <!-- 게이트웨이 위치·커버리지 (담당 구역 → 수신 세기 → 끔 순서로 순환) -->
      <button id="gw-btn" type="button">📡 게이트웨이</button>
      <div id="gw-hint" hidden></div>
      <!-- 환자용 패널(도트 그래픽) 진입 — 별 앱이라 새 탭으로 -->
      <a id="patient-btn" href="#" target="_blank" rel="noopener">🎮 환자용 패널</a>
