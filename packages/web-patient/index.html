<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediTracker — 대기 안내</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1420; overflow: hidden; }
      body { font-family: ui-sans-serif, system-ui, "Malgun Gothic", sans-serif; color: #e8eef7; }
      #app { width: 100%; height: 100%; }
      /* 도트 그래픽은 보간하면 뭉개진다 — 캔버스까지 nearest 로 못 박는다 */
      #app canvas { image-rendering: pixelated; }

      /* ── 상단 안내 HUD ────────────────────────────────────────────────── */
      #hud {
        position: fixed; left: 0; right: 0; top: 0; z-index: 50;
        padding: 10px 14px; box-sizing: border-box;
        background: linear-gradient(#0e1420ee, #0e1420aa 70%, #0e142000);
        pointer-events: none;
      }
      #hud .who { font-size: 13px; color: #8fd3c7; font-weight: 700; }
      #hud .where { margin-top: 2px; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
      #hud .sub { margin-top: 3px; font-size: 12px; color: #9fb0c6; }
      /* 방 안내 띠 — 바닥 화살표와 같은 빨강이라 둘이 한 쌍으로 읽힌다 */
      #guide-bar { display: none; }
      #guide-bar.show {
        display: block; margin-top: 8px; padding: 9px 13px; border-radius: 9px;
        background: #ff3b3022; border: 1px solid #ff3b3088; color: #ffd9d6;
        font-size: 14px; font-weight: 700;
      }
      #guide-bar b { color: #ff8a80; font-size: 16px; }
      /* 밀려 있는 직원 안내 — 지금 가는 곳보다 작고 흐리게 (지금 볼 것이 아니다) */
      #guide-bar small { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 600; color: #ffc9c4; opacity: .8; }
      #guide-bar.done { background: #1f6b4a33; border-color: #4fae7f88; color: #cdf3e0; }
      #guide-bar.done b { color: #7fe0ae; }

      /* ── 우하단 버튼 ──────────────────────────────────────────────────── */
      /* 굽(아래 그림자 한 칸)까지가 버튼이라 세로 간격을 그만큼 벌린다 */
      #ctrls {
        position: fixed; right: 14px; bottom: 18px; z-index: 50;
        display: flex; flex-direction: column; align-items: flex-end; gap: 11px;
      }

      /* ── 도트 버튼 ────────────────────────────────────────────────────────
         도면·캐릭터가 픽셀아트인데 UI 만 매끈하면 둘이 서로 겉돈다. 둥근 모서리와
         그라디언트를 버리고 **사각 그림자로 계단식 외곽선**을 만든다 (border-radius 는
         확대된 도트 사이에서 그 곡선만 매끄러워 오히려 튄다).

         한 칸 = 3px 로 못 박는다. 도트 한 칸의 크기가 눈에 보이는 격자를 만들어야
         테두리·하이라이트·굽이 "찍힌 것" 처럼 읽힌다. */
      /* 크기는 **못 박는다**. 라벨이 바뀌는 버튼들이라(화장실↔안내 끄기, 통역 호출↔호출 중…)
         내용에 맞춰 늘었다 줄면 누를 자리가 매번 옮겨 다닌다 — 글자가 바뀌어도 버튼은
         1px 도 안 움직여야 한다. 세 버튼이 같은 폭이라 오른쪽 변도 딱 맞는다. */
      .dotbtn {
        box-sizing: border-box; width: 136px; height: 40px;
        display: flex; align-items: center; justify-content: flex-start; gap: 8px;
        padding: 0 13px; border: none; border-radius: 0; cursor: pointer;
        background: #26415f; color: #e6f2ff;
        font: 800 13px/1 inherit; letter-spacing: -.01em;
        /* 외곽선 4장(모서리가 비어 계단이 된다) + 아래 굽 + 위 하이라이트·아래 그늘 */
        box-shadow:
          0 -3px #101d33, 0 3px #101d33, -3px 0 #101d33, 3px 0 #101d33,
          0 6px #0a1220,
          inset 0 3px #ffffff20, inset 0 -3px #00000045;
        transition: none; /* 도트 UI 에 부드러운 전환은 어울리지 않는다 — 딱딱 바뀐다 */
      }
      .dotbtn:hover { background: #2f5075; }
      /* 누르면 굽 한 칸만큼 실제로 내려앉는다 */
      .dotbtn:active {
        transform: translateY(3px);
        box-shadow:
          0 -3px #101d33, 0 3px #101d33, -3px 0 #101d33, 3px 0 #101d33,
          0 3px #0a1220,
          inset 0 3px #ffffff14, inset 0 -3px #00000045;
      }
      .dotbtn:disabled { cursor: default; color: #93a7c0; }
      .dotbtn .ico { flex: none; }
      /* 도트 아이콘 — 확대해도 계단이 살아 있어야 한다 (안티에일리어싱 금지) */
      .dotbtn .ico svg { display: block; shape-rendering: crispEdges; }
      .dotbtn .dim { opacity: .5; }

      /* 남/여 고르기 — 화장실은 남녀가 갈리는데(공용 1곳·여자용 2곳) 성별을 물어볼
         데가 없다. 배정에 성별이 들어오면 이 단계는 없어질 자리다. */
      #toilet-pick { display: none; }
      #toilet-pick.show {
        box-sizing: border-box; display: block; width: 136px; padding: 9px 9px 10px;
        background: #16233a;
        box-shadow:
          0 -3px #101d33, 0 3px #101d33, -3px 0 #101d33, 3px 0 #101d33,
          0 6px #0a1220,
          inset 0 3px #ffffff14;
      }
      #toilet-pick .ttl { margin-bottom: 8px; font: 700 11px/1.35 inherit; color: #9fb6d2; }
      #toilet-pick .row { display: flex; gap: 6px; }
      /* 두 칸이 정확히 반씩 — 글자가 '남'/'여' 한 자라 크기가 변할 일도 없다 */
      .dotbtn.sm {
        width: 50%; height: 38px; padding: 0;
        justify-content: center; font-size: 16px;
      }

      /* 전체 보기 ↔ 내 위치 — 상태에 따라 아이콘까지 바꾼다 (라벨만 바뀌면 못 읽는다) */
      #overview-btn .ico-pin { display: none; }
      #overview-btn.on .ico-map { display: none; }
      #overview-btn.on .ico-pin { display: block; }
      .dotbtn.on {
        background: #2c6b4a; color: #eafff4;
        box-shadow:
          0 -3px #123a26, 0 3px #123a26, -3px 0 #123a26, 3px 0 #123a26,
          0 6px #0a2416,
          inset 0 3px #ffffff26, inset 0 -3px #00000045;
      }
      .dotbtn.on:hover { background: #35815a; }

      /* 안내 중 — 바닥 화살표·안내 띠와 같은 빨강. 셋이 한 벌로 읽힌다 */
      .dotbtn.guiding {
        background: #a52a21; color: #ffe9e6;
        box-shadow:
          0 -3px #4a0f0a, 0 3px #4a0f0a, -3px 0 #4a0f0a, 3px 0 #4a0f0a,
          0 6px #2e0906,
          inset 0 3px #ffffff2b, inset 0 -3px #00000045;
      }
      .dotbtn.guiding:hover { background: #bd332a; }
      /* 통역 계열은 중간톤 틸 — 액팅보드와 같은 색을 쓴다 (액팅보드 설계 디자인 항목) */
      #itp-btn {
        background: #2e6157; color: #d8f2ea;
        box-shadow:
          0 -3px #123029, 0 3px #123029, -3px 0 #123029, 3px 0 #123029,
          0 6px #0a1f1a,
          inset 0 3px #ffffff20, inset 0 -3px #00000045;
      }
      #itp-btn:hover { background: #3a7669; }
      #itp-btn:disabled { background: #24443d; color: #7fa79c; }

      /* 통역 호출 알림 — 화면 아래 가운데. 도트 버튼과 같은 테두리 문법을 쓴다.
         시연 배지(bottom:10px)보다 위에 둔다 — 배지는 나중에 body 끝에 붙어서
         CSS 로 비켜 세울 수 없다 */
      #itp-toast {
        position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%);
        /* 폭도 못 박는다 — 문구(통역 호출 / 화장실 실패)마다 넓이가 달라지면
           같은 자리에 뜨는 알림이 매번 다른 물건처럼 보인다 */
        z-index: 160; display: none; box-sizing: border-box;
        width: min(300px, calc(100vw - 40px));
        padding: 11px 15px; text-align: center; pointer-events: none;
        background: #2e6157; color: #eafaf5;
        box-shadow:
          0 -3px #123029, 0 3px #123029, -3px 0 #123029, 3px 0 #123029,
          inset 0 3px #ffffff20, inset 0 -3px #00000045;
      }
      #itp-toast.show { display: block; }
      #itp-toast b { display: block; font-size: 14px; }
      /* 아직 서버에 붙지 않은 기능이다 — 그 사실을 문구에서 숨기지 않는다 */
      #itp-toast span { display: block; margin-top: 3px; font-size: 11px; color: #a8d6ca; }

      /* ── 첫 진입 커스터마이징 ─────────────────────────────────────────── */
      /* 팔찌 번호 입력 — 커스터마이징 화면과 같은 껍데기를 쓴다 */
      #pin-gate {
        position: fixed; inset: 0; z-index: 210; display: none;
        align-items: center; justify-content: center; padding: 20px;
        background: #0b111ceb;
      }
      #pin-gate.show { display: flex; }
      #pin-input {
        width: 100%; box-sizing: border-box; margin: 4px 0; padding: 14px 12px;
        border-radius: 9px; border: 1px solid #2b3a52; background: #0f1725; color: inherit;
        /* 번호를 한 글자씩 또박또박 읽어야 해서 고정폭 + 자간을 준다 */
        font: 800 26px/1.2 ui-monospace, "Consolas", monospace;
        letter-spacing: .18em; text-align: center; text-transform: uppercase;
      }
      #pin-input:focus { outline: none; border-color: #58a6ff; }
      #pin-input::placeholder { font-weight: 400; letter-spacing: .1em; color: #55647a; }
      .pin-err { min-height: 18px; margin: 6px 0 0; font-size: 12.5px; color: #ff9d9d; }
      #pin-go {
        width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; cursor: pointer;
        border: none; background: #2f6fd0; color: #fff; font: 800 15px inherit;
      }
      #pin-go:disabled { background: #26334a; color: #6d7d94; cursor: default; }
      #pin-gate .hint { margin-top: 12px; font-size: 11px; color: #6d7d94; }

      #setup {
        position: fixed; inset: 0; z-index: 200; display: none;
        align-items: center; justify-content: center; padding: 20px;
        background: #0b111ceb;
      }
      #setup.show { display: flex; }
      #pin-gate .card,
      #setup .card {
        width: 100%; max-width: 420px; padding: 18px;
        /* 항목이 5줄이라 작은 폰에서는 넘친다 — 카드 안에서 스크롤시킨다 */
        max-height: calc(100dvh - 32px); overflow-y: auto;
        background: #141d2e; border: 1px solid #2b3a52;
        border-radius: 14px; box-shadow: 0 16px 40px #000a;
      }
      #pin-gate h2, #setup h2 { margin: 0 0 10px; font-size: 19px; }
      #pin-gate p, #setup p { margin: 0 0 18px; font-size: 13px; color: #9fb0c6; line-height: 1.55; }
      #pin-gate p b { color: #cfe0f5; }
      /* 미리보기 무대 — 캐릭터가 가운데 크게 서서 움직인다 */
      #cc-stage {
        position: relative; display: flex; align-items: flex-end; justify-content: center;
        height: 176px; margin-bottom: 9px; border-radius: 10px;
        background: radial-gradient(ellipse at 50% 88%, #1b2a41 0%, #101827 62%);
      }
      #cc-view { image-rendering: pixelated; margin-bottom: 14px; }
      /* 발밑 그림자 — 없으면 캐릭터가 허공에 뜬 것처럼 보인다 */
      #cc-stage::after {
        content: ''; position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
        width: 54px; height: 12px; border-radius: 50%; background: #0007;
      }
      /* 자세 버튼은 왼쪽에 세로로 몰아둔다 — 가운데를 비워야 캐릭터가 잘 보인다 */
      #cc-poses {
        position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 5px;
      }
      #cc-poses button {
        padding: 7px 12px; border-radius: 8px; cursor: pointer;
        border: 1px solid #253046; background: #0f1725cc; color: #90a2b8; font: 700 12px inherit;
      }
      #cc-poses button.on { background: #22405f; border-color: #3f6f9e; color: #fff; }

      /* 항목 줄 — 손가락으로 누르는 화면이다 (환자 본인 폰에서 QR 로 들어온다).
         이름+화살표가 윗줄, 색 동그라미가 아랫줄. 한 줄에 다 넣으면 누를 것들이
         전부 20px 짜리가 돼서 못 누른다. */
      #cc-rows { display: flex; flex-direction: column; gap: 4px; }
      .cc-row {
        display: grid; grid-template-columns: 1fr auto; align-items: center;
        row-gap: 6px; padding: 5px 0; border-top: 1px solid #1e2a3e;
      }
      .cc-row:first-child { border-top: none; }
      .cc-row .nm { font-size: 13.5px; font-weight: 700; color: #b9c8dc; }
      .cc-row .pick {
        display: grid; grid-template-columns: 44px 66px 44px; align-items: center;
        border-radius: 10px; background: #0f1725; border: 1px solid #223047;
      }
      .cc-row .arw {
        border: none; background: none; cursor: pointer; height: 34px; padding: 0;
        color: #9db2cc; font-size: 15px; line-height: 1; border-radius: 9px;
      }
      .cc-row .arw:hover { color: #fff; background: #1b2942; }
      .cc-row .arw:active { background: #24395c; }
      .cc-row .cnt {
        text-align: center; font: 700 13px ui-monospace, "Consolas", monospace; color: #9fb0c6;
      }
      /* 색은 작게 두되 **한 줄에 다 보이게** 한다 — 가장 많은 게 10색이고,
         제 줄을 통째로 쓰면 20px 짜리 10개가 줄바꿈 없이 들어간다.
         고르는 것보다 "무슨 색들이 있나" 를 한눈에 보는 게 먼저다. */
      /* 장식을 '없음' 에서 고르면 없던 줄이 생겨 카드가 스크롤된다 —
         비어 있어도 자리를 잡아 두면 높이가 안 흔들린다 */
      .cc-row .sw {
        grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px;
      }
      .cc-row .sw i {
        width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
        border: 2px solid #2b3a52; box-sizing: border-box;
      }
      .cc-row .sw i:hover { border-color: #5b7ba6; }
      .cc-row .sw i.on { border-color: #fff; box-shadow: 0 0 0 2px #58a6ff; }
      /* 무대 안 빈 자리(우측 상단)에 얹어서 세로 한 줄을 통째로 아낀다 */
      #cc-random {
        position: absolute; right: 8px; top: 8px; z-index: 1;
        padding: 7px 12px; border-radius: 8px; cursor: pointer;
        border: 1px solid #35496a; background: #17233acc; color: #a9bdd6;
        font: 700 12px inherit;
      }
      #cc-random:hover { background: #22314d; color: #fff; }
      #nick {
        width: 100%; box-sizing: border-box; margin: 16px 0 4px; padding: 10px 12px;
        border-radius: 9px; border: 1px solid #2b3a52; background: #0f1725;
        color: inherit; font: 400 14px inherit;
      }
      #nick:focus { outline: none; border-color: #58a6ff; }
      #setup .hint { font-size: 11px; color: #6d7d94; }
      #start, #go {
        width: 100%; margin-top: 12px; padding: 12px; border-radius: 10px; cursor: pointer;
        border: none; background: #2f6fd0; color: #fff; font: 800 15px inherit;
      }
      #start:disabled { background: #26334a; color: #6d7d94; cursor: default; }
      #back {
        width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; cursor: pointer;
        border: 1px solid #2b3a52; background: none; color: #8fa3bb; font: 700 13px inherit;
      }
      #back:hover { background: #131d2e; color: #cfe3f7; }

      /* 오류가 나면 빈 화면만 남아 원인을 알 수 없다 — 화면에 그대로 띄운다 */
      #fatal {
        position: fixed; left: 12px; right: 12px; top: 80px; z-index: 300; display: none;
        padding: 14px 16px; border-radius: 10px;
        background: #3b1720; border: 1px solid #a33; color: #ffd7d7;
        font: 500 13px ui-monospace, monospace; white-space: pre-wrap; line-height: 1.5;
      }
      #fatal.show { display: block; }

      /* 시연 모드 배지 — 서버 없이 도는 중임을 숨기지 않는다.
         움직임이 진짜와 구분이 안 되므로, 표시가 없으면 실제 추적으로 오해한다. */
      #demo-badge {
        position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 150;
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        padding: 6px 14px; border-radius: 8px;
        background: #3a2c0ef0; border: 1px solid #a8801f;
        color: #ffd97a; text-align: center; pointer-events: none;
        font-family: ui-sans-serif, system-ui, "Malgun Gothic", sans-serif;
      }
      #demo-badge b { font-size: 12px; }
      #demo-badge span { font-size: 10.5px; color: #d3b878; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="who" id="hud-who"></div>
      <div class="where" id="hud-where">위치를 확인하는 중…</div>
      <div class="sub" id="hud-sub"></div>
      <!-- 방 안내 띠 — 화살표만으로는 어느 방인지 안 읽힌다 -->
      <div id="guide-bar"></div>
    </div>

    <!-- 우하단 조작 버튼.
         아이콘은 이모지가 아니라 **10×10 도트 그림**이다 — 이모지는 폰마다 그림이
         달라지고(같은 버튼이 기기마다 다른 그림), 안티에일리어싱된 벡터라 도트 화면에서
         혼자 매끈하다. rect 로 찍으면 도면·캐릭터와 같은 격자에 놓인다. -->
    <div id="ctrls">
      <!-- 남/여 고르기 — 화장실 버튼을 누르면 이 위로 펼쳐진다.
           #ctrls 가 아래를 기준으로 서 있어서 이게 열려도 버튼들은 제자리에 있다 -->
      <div id="toilet-pick">
        <div class="ttl">어느 화장실로 안내할까요?</div>
        <div class="row">
          <button class="dotbtn sm" type="button" data-gender="male">남</button>
          <button class="dotbtn sm" type="button" data-gender="female">여</button>
        </div>
      </div>

      <!-- 화장실 — 직원 손을 탈 이유가 없는 유일한 안내라 환자가 직접 켠다 -->
      <button id="toilet-btn" class="dotbtn" type="button">
        <span class="ico" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 10 10" fill="currentColor">
            <!-- 옆에서 본 변기: 물탱크 → 변기 테두리 → 몸통 → 받침 -->
            <rect x="1" y="0" width="3" height="3" />
            <rect x="1" y="3" width="8" height="2" />
            <rect x="2" y="5" width="6" height="2" />
            <rect x="4" y="7" width="3" height="2" />
            <rect x="2" y="9" width="6" height="1" />
          </svg>
        </span>
        <span class="lbl">화장실</span>
      </button>

      <!-- 통역 호출 — 아직 서버에 안 붙었다 (액팅보드 구현지시서 5: POST /itp-request) -->
      <button id="itp-btn" class="dotbtn" type="button">
        <span class="ico" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 10 10" fill="currentColor">
            <!-- 말풍선 둘 — 두 사람이 주고받는 말 = 통역 -->
            <rect class="dim" x="4" y="0" width="6" height="4" />
            <rect class="dim" x="8" y="4" width="1" height="1" />
            <rect x="0" y="5" width="6" height="4" />
            <rect x="1" y="9" width="1" height="1" />
          </svg>
        </span>
        <span class="lbl">통역 호출</span>
      </button>

      <button id="overview-btn" class="dotbtn" type="button">
        <span class="ico ico-map" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 10 10" fill="currentColor">
            <!-- 접힌 지도: 네 변 + 접힌 선 둘 -->
            <rect x="0" y="2" width="10" height="1" />
            <rect x="0" y="7" width="10" height="1" />
            <rect x="0" y="3" width="1" height="4" />
            <rect x="9" y="3" width="1" height="4" />
            <rect x="3" y="3" width="1" height="4" />
            <rect x="6" y="3" width="1" height="4" />
          </svg>
        </span>
        <span class="ico ico-pin" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 10 10" fill="currentColor">
            <!-- 위치 핀 -->
            <rect x="3" y="0" width="4" height="1" />
            <rect x="2" y="1" width="6" height="4" />
            <rect x="3" y="5" width="4" height="1" />
            <rect x="4" y="6" width="2" height="3" />
          </svg>
        </span>
        <span class="lbl">전체 보기</span>
      </button>
    </div>

    <!-- 통역 호출 결과 알림 -->
    <div id="itp-toast"></div>

    <!-- 화면이 비어 보일 때 원인을 알 수 있게 오류를 그대로 표시 -->
    <div id="fatal"></div>

    <!-- 첫 진입: 캐릭터 고르기 (서버에 저장 — 태그 반납 시 초기화) -->
    <!-- 팔찌 번호 입력 — 커스터마이징보다 먼저. QR 로 들어오면 건너뛴다 -->
    <div id="pin-gate">
      <div class="card">
        <h2>팔찌 번호 입력</h2>
        <p>받으신 팔찌에 적힌 <b>6자리 번호</b>를 입력해 주세요.</p>
        <input
          id="pin-input"
          type="text"
          inputmode="latin"
          maxlength="9"
          placeholder="예: 9E1BC4"
          spellcheck="false"
          autocomplete="off"
        />
        <div class="pin-err" id="pin-err"></div>
        <button id="pin-go" type="button" disabled>입장하기</button>
        <div class="hint">번호가 안 보이거나 들어가지지 않으면 데스크에 말씀해 주세요.</div>
      </div>
    </div>

    <div id="setup">
      <div class="card">
        <h2 id="cc-title">내 캐릭터 만들기</h2>
        <!-- 미리보기 — 고를 때마다 바로 바뀌고, 서 있는 동안 숨을 쉰다.
             별명 단계에서도 그대로 두고 아래만 바꾼다 -->
        <div id="cc-stage">
          <canvas id="cc-view"></canvas>
          <button id="cc-random" type="button">🎲 아무거나</button>
          <div id="cc-poses"></div>
        </div>
        <!-- 1단계: 캐릭터 만들기. 항목 줄은 화면 쪽에서 채운다 -->
        <div id="cc-step1">
          <div id="cc-rows"></div>
          <button id="start" type="button" disabled>다음</button>
        </div>
        <!-- 2단계: 별명. 캐릭터를 다 만든 뒤에 묻는다 -->
        <div id="cc-step2" hidden>
          <input id="nick" type="text" maxlength="12" placeholder="별명 (선택)" spellcheck="false" />
          <div class="hint">별명은 다른 환자에게 보이지 않습니다. 비콘을 반납하면 초기화됩니다.</div>
          <button id="go" type="button">시작하기</button>
          <button id="back" type="button">캐릭터 다시 만들기</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
