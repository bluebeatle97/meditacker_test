<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediTracker — 대기 안내</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1420; overflow: hidden; }
      body { font-family: ui-sans-serif, system-ui, "Malgun Gothic", sans-serif; color: #e8eef7; }
      #app { width: 100%; height: 100%; }
      /* 도트 그래픽은 보간하면 뭉개진다 — 캔버스까지 nearest 로 못 박는다 */
      #app canvas { image-rendering: pixelated; }

      /* ── 상단 안내 HUD ────────────────────────────────────────────────── */
      #hud {
        position: fixed; left: 0; right: 0; top: 0; z-index: 50;
        padding: 10px 14px; box-sizing: border-box;
        background: linear-gradient(#0e1420ee, #0e1420aa 70%, #0e142000);
        pointer-events: none;
      }
      #hud .who { font-size: 13px; color: #8fd3c7; font-weight: 700; }
      #hud .where { margin-top: 2px; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
      #hud .sub { margin-top: 3px; font-size: 12px; color: #9fb0c6; }

      /* ── 우하단 버튼 ──────────────────────────────────────────────────── */
      #ctrls { position: fixed; right: 12px; bottom: 14px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
      #ctrls button {
        padding: 10px 14px; border-radius: 9px; cursor: pointer;
        border: 1px solid #3a5a7d; background: #16233aee; color: #cfe3f7;
        font: 700 13px inherit;
      }
      #ctrls button:hover { background: #1e304d; }
      #ctrls button.on { background: #2c6b4a; border-color: #4fae7f; color: #fff; }

      /* ── 첫 진입 커스터마이징 ─────────────────────────────────────────── */
      /* 팔찌 번호 입력 — 커스터마이징 화면과 같은 껍데기를 쓴다 */
      #pin-gate {
        position: fixed; inset: 0; z-index: 210; display: none;
        align-items: center; justify-content: center; padding: 20px;
        background: #0b111ceb;
      }
      #pin-gate.show { display: flex; }
      #pin-input {
        width: 100%; box-sizing: border-box; margin: 4px 0; padding: 14px 12px;
        border-radius: 9px; border: 1px solid #2b3a52; background: #0f1725; color: inherit;
        /* 번호를 한 글자씩 또박또박 읽어야 해서 고정폭 + 자간을 준다 */
        font: 800 26px/1.2 ui-monospace, "Consolas", monospace;
        letter-spacing: .18em; text-align: center; text-transform: uppercase;
      }
      #pin-input:focus { outline: none; border-color: #58a6ff; }
      #pin-input::placeholder { font-weight: 400; letter-spacing: .1em; color: #55647a; }
      .pin-err { min-height: 18px; margin: 6px 0 0; font-size: 12.5px; color: #ff9d9d; }
      #pin-go {
        width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; cursor: pointer;
        border: none; background: #2f6fd0; color: #fff; font: 800 15px inherit;
      }
      #pin-go:disabled { background: #26334a; color: #6d7d94; cursor: default; }
      #pin-gate .hint { margin-top: 12px; font-size: 11px; color: #6d7d94; }

      #setup {
        position: fixed; inset: 0; z-index: 200; display: none;
        align-items: center; justify-content: center; padding: 20px;
        background: #0b111ceb;
      }
      #setup.show { display: flex; }
      #pin-gate .card,
      #setup .card {
        width: 100%; max-width: 420px; padding: 22px;
        background: #141d2e; border: 1px solid #2b3a52;
        border-radius: 14px; box-shadow: 0 16px 40px #000a;
      }
      #pin-gate h2, #setup h2 { margin: 0 0 4px; font-size: 20px; }
      #pin-gate p, #setup p { margin: 0 0 18px; font-size: 13px; color: #9fb0c6; line-height: 1.55; }
      #pin-gate p b { color: #cfe0f5; }
      #chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .char {
        padding: 10px 4px 8px; border-radius: 10px; cursor: pointer;
        background: #101827; border: 2px solid #253046; text-align: center;
      }
      .char:hover { background: #162033; }
      .char.sel { border-color: #58a6ff; background: #17263c; }
      /* 스프라이트 시트에서 '정면(아래)' 프레임 한 장만 잘라 보여준다 */
      .char .pic {
        width: 48px; height: 96px; margin: 0 auto 6px;
        background-repeat: no-repeat; background-size: 1152px 96px;   /* 384x32 을 3배 */
        background-position: -864px 0;                                /* 19번째 프레임 = 정면 */
        image-rendering: pixelated;
      }
      .char .nm { font-size: 11px; color: #b9c8dc; font-weight: 700; }
      #nick {
        width: 100%; box-sizing: border-box; margin: 16px 0 4px; padding: 10px 12px;
        border-radius: 9px; border: 1px solid #2b3a52; background: #0f1725;
        color: inherit; font: 400 14px inherit;
      }
      #nick:focus { outline: none; border-color: #58a6ff; }
      #setup .hint { font-size: 11px; color: #6d7d94; }
      #start {
        width: 100%; margin-top: 16px; padding: 12px; border-radius: 10px; cursor: pointer;
        border: none; background: #2f6fd0; color: #fff; font: 800 15px inherit;
      }
      #start:disabled { background: #26334a; color: #6d7d94; cursor: default; }

      /* 오류가 나면 빈 화면만 남아 원인을 알 수 없다 — 화면에 그대로 띄운다 */
      #fatal {
        position: fixed; left: 12px; right: 12px; top: 80px; z-index: 300; display: none;
        padding: 14px 16px; border-radius: 10px;
        background: #3b1720; border: 1px solid #a33; color: #ffd7d7;
        font: 500 13px ui-monospace, monospace; white-space: pre-wrap; line-height: 1.5;
      }
      #fatal.show { display: block; }

      /* 시연 모드 배지 — 서버 없이 도는 중임을 숨기지 않는다.
         움직임이 진짜와 구분이 안 되므로, 표시가 없으면 실제 추적으로 오해한다. */
      #demo-badge {
        position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 150;
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        padding: 6px 14px; border-radius: 8px;
        background: #3a2c0ef0; border: 1px solid #a8801f;
        color: #ffd97a; text-align: center; pointer-events: none;
        font-family: ui-sans-serif, system-ui, "Malgun Gothic", sans-serif;
      }
      #demo-badge b { font-size: 12px; }
      #demo-badge span { font-size: 10.5px; color: #d3b878; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="who" id="hud-who"></div>
      <div class="where" id="hud-where">위치를 확인하는 중…</div>
      <div class="sub" id="hud-sub"></div>
    </div>

    <div id="ctrls">
      <button id="overview-btn" type="button">🗺 전체 보기</button>
    </div>

    <!-- 화면이 비어 보일 때 원인을 알 수 있게 오류를 그대로 표시 -->
    <div id="fatal"></div>

    <!-- 첫 진입: 캐릭터 고르기 (서버에 저장 — 태그 반납 시 초기화) -->
    <!-- 팔찌 번호 입력 — 커스터마이징보다 먼저. QR 로 들어오면 건너뛴다 -->
    <div id="pin-gate">
      <div class="card">
        <h2>팔찌 번호 입력</h2>
        <p>받으신 팔찌에 적힌 <b>6자리 번호</b>를 입력해 주세요.</p>
        <input
          id="pin-input"
          type="text"
          inputmode="latin"
          maxlength="9"
          placeholder="예: 9E1BC4"
          spellcheck="false"
          autocomplete="off"
        />
        <div class="pin-err" id="pin-err"></div>
        <button id="pin-go" type="button" disabled>입장하기</button>
        <div class="hint">번호가 안 보이거나 들어가지지 않으면 데스크에 말씀해 주세요.</div>
      </div>
    </div>

    <div id="setup">
      <div class="card">
        <h2>내 캐릭터 고르기</h2>
        <p>대기 화면에서 나를 나타낼 캐릭터입니다.<br />별칭은 다른 환자에게 보이지 않습니다.</p>
        <div id="chars"></div>
        <input id="nick" type="text" maxlength="12" placeholder="별칭 (선택)" spellcheck="false" />
        <div class="hint">진료가 끝나고 비콘을 반납하면 초기화됩니다.</div>
        <button id="start" type="button" disabled>시작하기</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
