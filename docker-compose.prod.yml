# EC2 배포 — meditracker(서버 + 화면 + 목 게이트웨이) + Caddy(HTTPS).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 값은 같은 폴더의 `.env` 에서 읽는다 (compose 가 자동으로 읽는다). 없으면 기동을 거부한다 —
# 기본 핀·기본 서명키로 공개 서버가 떠 있는 상태가 제일 위험하다.
#
# ⚠️ 여기로 들어오는 스캔은 **목 게이트웨이가 만든 가상 신호**다. 원내 실장비는 같은 LAN 의
#    브로커로만 신호를 쏘므로 클라우드까지 오지 않는다. 이 배포는 대외 시연용이고, 실운영
#    본체는 계속 원내 PC 다 (README '실제 병원 설치는 이 방식이 아니다').
services:
  meditracker:
    build: .
    restart: unless-stopped
    environment:
      # ⚠️ production 이어야 핀 없이 토큰을 내주는 개발 창구(/dev-token, GET /staff-token)가
      #    닫힌다. 여기를 바꾸면 진입 핀이 무의미해진다.
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: '${JWT_SECRET:?.env 에 JWT_SECRET 을 넣어라 — openssl rand -hex 32}'
      STAFF_PIN: '${STAFF_PIN:?.env 에 STAFF_PIN 을 넣어라 — 직원용·관제 진입 핀}'
      DB_PATH: /data/meditracker.db
      # 가상 인원 이동 속도 (2 = 2배속). 시연에서 답답하면 올린다
      MOCK_SPEED: ${MOCK_SPEED:-1}
    volumes:
      # SQLite 를 컨테이너 밖에 둔다 — 안에 두면 재배포마다 초기화된다. 부팅 때 시드가
      # upsert 로 다시 들어가므로 남아 있어도 충돌하지 않는다.
      - ./data:/data
    expose:
      # 호스트에 열지 않는다. 바깥에서 오는 길은 Caddy(443)뿐이다
      - '8080'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80' # 인증서 발급 확인 + https 리다이렉트
      - '443:443'
    environment:
      SITE_DOMAIN: '${SITE_DOMAIN:?.env 에 SITE_DOMAIN 을 넣어라 — 예 rtls.example.com}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 받은 인증서가 여기 있다. 지우면 재발급 → 실패가 쌓이면 발급 한도에 걸린다
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - meditracker

volumes:
  caddy-data:
  caddy-config:
