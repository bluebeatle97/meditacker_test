# 서버 이미지 빌드 — main 에 push 하면 이미지를 만들어 ghcr.io 에 올린다.
#
# **왜 이걸 하나.** 예전에는 EC2 에서 `up -d --build` 로 빌드했다. 2GB 램에서 **서버가 도는
# 채로** better-sqlite3 컴파일 + Vite 빌드 2개가 돌아가는 상태라, 배포가 5~10분 걸리고 그
# 동안 CPU·메모리를 서버와 다퉜다. 여기서 빌드하면 서버는 **받아서 켜기만** 한다(10초쯤).
#
# 이미지가 올라가면 **이어서 배포까지 한다** (EC2 에 ssh → pull → up -d → 헬스체크).
#
# ⚠️ 이 서버는 재기동이 공짜가 아니다 — 붙어 있던 소켓이 전부 끊기고, 존 판정이 처음부터 다시
#    수렴하고, 테스트 장비 토글이 기본값(실장비)으로 돌아간다. **시연 중에는 push 하지 않는다.**
#    급하게 고쳐야 하면 커밋 **제목 줄**에 `[no deploy]` 를 넣는다 — 이미지는 만들고 배포만
#    건너뛴다. (본문이 아니라 제목이다. 본문까지 보면 이 탈출구를 설명하는 커밋이 스스로
#    배포를 건너뛴다 — 실제로 그렇게 한 번 당했다.)
#
# 이미지는 저장소 공개 설정을 물려받아 공개로 올라간다 — EC2 가 자격증명 없이 받는다.
# 저장소를 비공개로 돌리면 이미지도 비공개가 되므로, 그때는 EC2 에서 `docker login ghcr.io`
# (read:packages 토큰)가 필요해진다.
name: Build server image

on:
  push:
    branches: [main]
    # 문서만 고친 push 로는 이미지를 다시 만들지 않는다 (이미지 내용이 안 바뀐다)
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # Actions 탭에서 손으로 돌릴 수 있게

permissions:
  contents: read
  packages: write # ghcr.io 에 올리는 데 필요 (GITHUB_TOKEN 으로 로그인한다)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 연달아 push 하면 앞의 빌드는 버린다 — 어차피 최신 것만 쓴다
    concurrency:
      group: image-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = 지금 배포할 것, sha-<커밋> = 되돌릴 지점.
      # 롤백은 서버에서 IMAGE_TAG 만 바꿔 다시 올리면 된다 (docker-compose.prod.yml 주석 참조)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # amd64 만 만든다 — 배포 인스턴스가 t3(x86)다. arm64(t4g)로 옮길 일이 생기면
      # platforms 에 linux/arm64 를 더한다 (빌드 시간이 배로 늘어난다)
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 의존성 층을 캐시해 둔다 — 소스만 바뀐 재빌드가 몇 분 → 1분대로 줄어든다
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 배포: 서버는 받아서 켜기만 한다 ──────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 배포는 **취소하지 않는다.** 두 번째 push 가 첫 배포를 중간에 끊으면 컨테이너가 반쯤
    # 바뀐 상태로 남는다. 겹치면 뒤엣것이 기다린다.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 43.200.199.176
      DEPLOY_USER: ubuntu
      HEALTH_URL: https://43-200-199-176.sslip.io/health
    steps:
      # 배포할지 여기서 정한다. 둘 중 하나라도 걸리면 건너뛰지만 **초록불로** 끝낸다 —
      # 이미지는 이미 올라갔으니 실패가 아니다.
      #
      # ⚠️ 표식은 커밋 메시지 **제목 줄만** 본다. 예전에는 잡 레벨 `if` 에서 메시지 전체를
      #    봤는데, 이 탈출구를 설명하는 문장을 커밋 본문에 적었더니 그 커밋이 스스로 배포를
      #    건너뛰었다. 본문에서 표식을 언급하는 일은 앞으로도 계속 생긴다.
      - id: guard
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s' "$MSG" | head -1)
          case "$subject" in
            *'[no deploy]'*)
              echo "::notice::제목에 배포 건너뛰기 표식이 있어 배포하지 않는다 (이미지는 올라갔다)"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ -z "$KEY" ]; then
            echo "::notice::DEPLOY_SSH_KEY 시크릿이 없어 배포를 건너뛴다 (이미지는 올라갔다)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH 키 준비
        if: steps.guard.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

      - name: 배포 (git pull → 이미지 받기 → 재기동)
        if: steps.guard.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" '
              set -e
              cd ~/meditracker
              git pull --ff-only
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
              docker image prune -f
            '

      # 여기가 없으면 "배포는 됐는데 서버가 안 뜬" 상태를 초록불로 넘긴다
      - name: 헬스체크
        if: steps.guard.outputs.ready == 'true'
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS -m 10 "$HEALTH_URL" || true)
            case "$body" in
              *'"ok":true'*) echo "정상: $body"; exit 0 ;;
            esac
            echo "기다린다… ($i/20)"
            sleep 3
          done
          echo "60초 안에 /health 가 ok 를 주지 않았다 — 배포 실패로 본다"
          exit 1
